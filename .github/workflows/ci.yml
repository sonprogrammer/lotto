name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 코드 형식 검사
        run: npm run format:check

      - name: ESLint 검사
        run: npm run lint

      - name: TypeScript 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 배포용 빌드
        run: npm run build
